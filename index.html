<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="apple-mobile-web-app-title" content="Terminal" />
  <meta name="description" content="Progressive Web Application for serial communication with your own Bluetooth Low Energy (Smart) devices" />
  <meta name="viewport"    content="width=device-width, initial-scale=1" />

  <title>Web Bluetooth Terminal</title>

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" href="icons/favicon-96x96.png" sizes="96x96" type="image/png" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/web-app-manifest-192x192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="icons/web-app-manifest-512x512.png" sizes="512x512" type="image/png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="shortcut icon" href="icons/favicon.ico" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Mono" />
  <!-- Чтобы эта иконка появилась на экране,HTML-документа должна быть подключена библиотека: -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <!-- <link rel="stylesheet" href="css/normalize.css" /> -->
  <link rel="stylesheet" href="styles.css" />
 
</head>

<body>

 <h3>TERMINAL BLUETOOTH</h3>
  <div class="toolbar">
    <div>
      <p><span id="device-name">Подключить устройство</span></p>
    </div>
    
      <div class="buttons-tool">
      <button id="connect" class="button-bt" type="button"><i class="material-icons">bluetooth_searching</i></button>
      <button id="disconnect" class="button-bt" type="button"><i class="material-icons">bluetooth_disabled</i></button>
      </div>
     </div>
   <!-- форма для отправки сообщений -->
   <div id="blok-message">
    <form id="message-form" class="message-form">
        <input id="message-input" type="text" autocomplete="off" placeholder="ОТПРАВИТЬ КОМАНДУ">
        <button type="submit" class="button-bt"><i class="material-icons">send</i></button>
    </form>
   </div> 

   <!-- вхлдящие данные -->
  <div class="input-data">
     <div>
       <p> <strong id="in-tx1-1">IN DATA-1</strong> </p>
     </div>
     <div>
       <p> <strong id="in-txt-2">IN DATA-2</strong> </p>
     </div>
   
  </div>
   
 <!-- пользовательские кнопки -->
<div class="blok-key">
  <div> <button id="userkey1" class="button-user" type="button">key1</button></div>
  <div> <button id="userkey2" class="button-user" type="button">key2</button></div>
  <div> <button id="userkey3" class="button-user" type="button">key3</button></div>
 </div>


<div class="app">
       <div id="terminal" class="terminal">
        <!-- здесь будут все собщения -->
       </div>

  </div>

<!-- подключение скриптов -->
  <script src="js/BluetoothTerminal.js"></script>
  <script src="js/main.js"></script>
  <script src="js/register-sw.js"></script>

</body>

</html>
